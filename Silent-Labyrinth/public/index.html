<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <!-- این تگ مشکل زوم بودن و کوچک بودن در موبایل را حل می‌کند -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silent Labyrinth</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap');
        body { font-family: 'Vazirmatn', sans-serif; }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex items-center justify-center p-4">
    <div class="bg-gray-800 rounded-2xl shadow-2xl p-6 sm:p-8 max-w-md w-full text-center border border-gray-700">
        
        <h1 class="text-4xl sm:text-5xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500 mb-4 drop-shadow-lg">
            Silent Labyrinth
        </h1>
        <p class="text-gray-300 text-lg mb-8">وضعیت مصرف اشتراک شما</p>

        <div id="loading" class="text-gray-400 mb-4 animate-pulse">در حال دریافت اطلاعات...</div>
        <div id="error" class="text-red-400 hidden mb-4 bg-red-900/30 p-3 rounded-lg border border-red-800"></div>

        <div id="content" class="hidden">
            <div class="flex justify-between items-center mb-3 text-sm sm:text-base">
                <span>حجم مصرفی: <span id="used-value" class="font-bold text-white text-lg ml-1"></span></span>
                <span>کل: <span id="total-value" class="font-bold text-white text-lg ml-1"></span></span>
            </div>

            <div class="w-full bg-gray-700 rounded-full h-5 mb-8 shadow-inner overflow-hidden relative">
                <div id="progress-bar" class="bg-gradient-to-r from-purple-500 to-pink-500 h-full rounded-full transition-all duration-1000 ease-out" style="width: 0%"></div>
            </div>
        </div>

        <hr class="border-gray-700 my-6">

        <div class="text-gray-400 text-sm space-y-2">
            <p>Admin: <span class="text-purple-400 font-bold">Alireza</span></p>
            <p>Telegram: <a href="https://t.me/mewsica" dir="ltr" class="text-blue-400 hover:text-blue-300 transition-colors font-bold tracking-wider">@mewsica</a></p>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const username = urlParams.get('user');

        if (!username) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('error').textContent = 'نام کاربری در لینک وارد نشده است.';
            document.getElementById('error').classList.remove('hidden');
        } else {
            fetch(`/api/users?user=${username}`)
                .then(response => {
                    if (!response.ok) throw new Error('کاربر یافت نشد');
                    return response.json();
                })
                .then(data => {
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('content').classList.remove('hidden');

                    // تنظیم مقادیر با واحد MB
                    document.getElementById('used-value').textContent = `${data.used} MB`;
                    document.getElementById('total-value').textContent = `${data.total} MB`;

                    // محاسبه درصد برای نوار پیشرفت
                    let percent = 0;
                    if (data.total > 0) {
                        percent = (data.used / data.total) * 100;
                    }
                    if (percent > 100) percent = 100;

                    // اجرای انیمیشن نوار
                    setTimeout(() => {
                        const progressBar = document.getElementById('progress-bar');
                        progressBar.style.width = `${percent}%`;
                        
                        // اگر مصرف بیش از 90 درصد بود، رنگ نوار هشداردهنده (قرمز/نارنجی) شود
                        if (percent >= 90) {
                            progressBar.classList.remove('from-purple-500', 'to-pink-500');
                            progressBar.classList.add('from-red-500', 'to-orange-500');
                        }
                    }, 150);
                })
                .catch(err => {
                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('error').textContent = 'کاربر یافت نشد یا اشتراک نامعتبر است.';
                    document.getElementById('error').classList.remove('hidden');
                });
        }
    </script>
</body>
</html>
