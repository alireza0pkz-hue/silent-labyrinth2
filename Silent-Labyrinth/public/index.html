<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Silent Labyrinth - User</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { background: #0f172a; color: white; }</style>
</head>
<body class="flex h-screen items-center justify-center p-4">
    <div class="bg-white/10 backdrop-blur-lg p-8 rounded-3xl shadow-2xl w-full max-w-md border border-white/20 text-center">
        <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-600 mb-2">Silent Labyrinth</h1>
        <p class="text-gray-300 mb-8 text-sm">وضعیت مصرف اشتراک شما</p>
        
        <div id="loading" class="animate-pulse text-purple-300">در حال دریافت اطلاعات...</div>
        <div id="error" class="hidden text-red-400 font-bold bg-red-900/50 p-4 rounded-xl">کاربری یافت نشد.</div>
        
        <div id="content" class="hidden">
            <div class="flex justify-between mb-2 text-sm">
                <span class="text-gray-400">حجم مصرفی: <span id="used" class="text-white font-bold"></span></span>
                <span class="text-gray-400">کل: <span id="total" class="text-white font-bold"></span></span>
            </div>
            <div class="w-full bg-gray-800 rounded-full h-6 mb-2 overflow-hidden border border-gray-700">
                <div id="bar" class="bg-gradient-to-r from-green-400 to-emerald-600 h-full transition-all duration-1000 shadow-[0_0_10px_rgba(52,211,118,0.8)]" style="width: 0%"></div>
            </div>
            <p id="percent" class="text-green-400 font-bold text-lg mb-8"></p>
        </div>

        <div class="mt-8 pt-4 border-t border-white/10 text-xs text-gray-400">
            <p>Admin: <span class="text-purple-300">Alireza</span></p>
            <p class="mt-1">Telegram: <a href="https://t.me/mewsica" class="text-blue-400 hover:text-blue-300">@mewsica</a></p>
        </div>
    </div>

    <script>
        const user = new URLSearchParams(window.location.search).get('user');
        if(!user) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('error').classList.remove('hidden');
            document.getElementById('error').innerText = 'لینک نامعتبر است.';
        } else {
            fetch(`/api/users?user=${user}`)
            .then(r => r.json())
            .then(data => {
                document.getElementById('loading').classList.add('hidden');
                if(data.error) {
                    document.getElementById('error').classList.remove('hidden');
                } else {
                    document.getElementById('content').classList.remove('hidden');
                    document.getElementById('total').innerText = data.total + ' GB';
                    document.getElementById('used').innerText = data.used + ' GB';
                    let pct = Math.max(0, ((data.total - data.used) / data.total) * $100$).toFixed(1);
                    document.getElementById('bar').style.width = pct + '%';
                    document.getElementById('percent').innerText = pct + '% باقیمانده';
                    if(pct < $20$) document.getElementById('bar').classList.replace('from-green-400', 'from-red-500');
                }
            });
        }
    </script>
</body>
</html>
